[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "social_proof"
version = "0.1.0"
description = "Closed-corpus self-consistency checker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "pydantic>=2.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.26.0",
    "yt-dlp>=2024.0.0",
    "sentence-transformers>=3.0.0",
    "einops>=0.8.0",
    "faster-whisper>=1.0.0",
    "mlx-lm>=0.20.0",
    "pyannote.audio>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "yt_dlp", "yt_dlp.*", "sentence_transformers", "sentence_transformers.*", "faster_whisper", "faster_whisper.*", "mlx", "mlx.*", "mlx_lm", "mlx_lm.*", "pyannote", "pyannote.*", "pyannote.audio", "pyannote.audio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
