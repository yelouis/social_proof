[mypy]
# An ignore that is no longer needed is a lie about the code.
# This also makes B7's deliberately-red test self-cleaning: once
# run_episode_extraction accepts `extractor` and `output_dir`, the
# `type: ignore[call-arg]` in test_b7_provenance.py becomes unused and
# mypy goes red until it is deleted.
warn_unused_ignores = True
