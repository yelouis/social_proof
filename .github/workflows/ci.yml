name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check worker/ tests/

      - name: Type check with mypy
        run: mypy worker/

      - name: Run unit & integration tests
        run: pytest tests/ -v

      - name: Run evidence integrity pass
        run: python -m worker.integrity --all
