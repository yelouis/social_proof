name: portability

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (base + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check worker/ tests/ fixtures/ golden/ scripts/

      - name: Type check with mypy
        run: mypy worker/ tests/ fixtures/ golden/ scripts/

      - name: Run fast non-model tests
        run: pytest -m "not requires_models"
